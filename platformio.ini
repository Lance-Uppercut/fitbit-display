[platformio]
default_envs = esp32dev_serial
src_dir = .

[env]
build_flags =
  -I${PROJECT_DIR}
  -D LED_BUILTIN=2
  -ffunction-sections
  -Wl,--gc-sections
  -Wl,-Map=output.map
  -fverbose-asm
  -g
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
  jfturcot/SimpleTimer
  links2004/WebSockets @ ^2.4.1
  bblanchon/ArduinoJson @ ^6.21.3
  adafruit/DHT sensor library @ ^1.4.6
  adafruit/Adafruit Unified Sensor @ ^1.1.14
  jandrassy/TelnetStream @ ^1.3.0
  https://github.com/Offbeat-IoT/ota.git
  gyverlibs/buildTime@^1.0
  fastled/FastLED @ ^3.6.0

[env:esp32dev_serial]
platform = espressif32
board = esp32dev
framework = arduino
upload_protocol = esptool
upload_speed = 115200
upload_port = COM4
build_type = debug

[env:esp32dev_ota]
extends = env:esp32dev_serial
build_type = release
upload_protocol = espota
upload_port = FitbitDisplay
